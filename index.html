<!DOCTYPE html>
<html lang="ru">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сложно сосредоточиться</title>
    <script src="./scripts/script.js"></script>
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/dark.css">
    <link rel="stylesheet" href="./styles/light.css">
    <meta name="color-scheme" content="dark light">
<!--    фавиконки-->
    <!-- Стандартная фавиконка для всех браузеров -->
    <link rel="icon" href="images/favicon.ico" sizes="32x32">

    <!-- Векторная иконка для современных -->
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

    <!-- Иконка для iOS устройств -->
    <link rel="apple-touch-icon" href="images/mobile-icon.png" sizes="180x180">
  </head>

  <body class="page">
    <header class="header decorated-zone">

      <div class="header__rec-container" aria-hidden="true">
        <span class="header__rec-text">REC</span>
      </div>

<!--меню с кнопками переключения тем-->
      <nav class="header__theme-menu">
        <ul class="header__theme-menu-list">
<!--тема - день-->
          <li class="header__theme-menu-item">
            <button
              class="header__theme-menu-button header__theme-menu-button_type_light">
              день
            </button>
          </li>
<!--тема - авто-->
          <li class="header__theme-menu-item">
            <button
              class="header__theme-menu-button header__theme-menu-button_active header__theme-menu-button_type_auto"
              disabled
            >
              авто
            </button>
          </li>
<!--тема - неон-->
          <li class="header__theme-menu-item">
            <button
              class="header__theme-menu-button header__theme-menu-button_type_dark">
              неон
            </button>
          </li>

        </ul>
      </nav>

    </header>
  </body>
